<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="store-size" content="1400x560">
<title>Promo tile, marquee (1400×560)</title>
<link rel="stylesheet" href="../theme.css">
<style>
  body, .slide { width: 1400px; height: 560px; }
  .slide { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }

  /* Same idea as the small tile, with room to breathe: the name wears its own furigana. */
  .mark { display: flex; align-items: center; gap: 36px; }
  .mark img { width: 140px; height: 140px; border-radius: 30px; box-shadow: 0 0 0 5px rgba(255, 255, 255, .9), 0 18px 44px rgba(4, 30, 70, .3); }
  .name { margin: 0; font-size: 124px; font-weight: 700; line-height: 1; letter-spacing: -.02em; ruby-position: over; }
  .name rt { font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif; font-size: 38px; font-weight: 700; color: #bfe0ff; ruby-align: center; padding-bottom: 10px; }
  .tag { margin: 0; font-size: 32px; font-weight: 600; opacity: .9; }
</style>
<script src="../i18n.js" defer></script>
</head>
<body>
<main class="slide blue">
  <div class="mark">
    <img src="../../chrome/icons/icon128.png" alt="">
    <h1 class="name"><ruby lang="en">Tsu<rt lang="ja">つ</rt>ke<rt lang="ja">け</rt>ru<rt lang="ja">る</rt></ruby></h1>
  </div>
  <p class="tag" data-i18n="promo_tag_long" data-fit="promo_tag_long">Furigana and a dictionary for any website</p>
</main>
</body>
</html>
