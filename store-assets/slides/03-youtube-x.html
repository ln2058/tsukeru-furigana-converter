<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 YouTube and X</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .slide > .headline { position: absolute; left: var(--margin); top: 52px; }
  .slide .lockup { position: absolute; right: var(--margin); top: 60px; }

  /* Split: two browser windows side by side, each 556px wide. */
  .browser { top: 180px; bottom: 0; width: 556px; }
  .browser.left { left: var(--margin); }
  .browser.right { right: var(--margin); }
  .ext-btn.idle { background: transparent; }

  /* Captures: 2x, furigana on, zoomed out so the YouTube and X interfaces are recognisable. */
  .yt-shot { --iw: 2400; --x: 0; --y: 0; --w: 1630; --h: 1600; --s: .34125; }
  .x-shot { --iw: 2400; --x: 150; --y: 0; --w: 1630; --h: 1600; --s: .34125; }

</style>
<script src="../i18n.js" defer></script>
</head>
