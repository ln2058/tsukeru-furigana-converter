<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.52" numOctaves="2" seed="23" result="fibers"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" seed="41" result="grain"/>
    <feBlend in="fibers" in2="grain" mode="multiply" result="texture"/>
    <feColorMatrix in="texture" type="saturate" values="0" result="gray"/>
    <feComponentTransfer in="gray">
      <feFuncR type="linear" slope="0.72" intercept="0.14"/>
      <feFuncG type="linear" slope="0.72" intercept="0.14"/>
      <feFuncB type="linear" slope="0.72" intercept="0.14"/>
      <feFuncA type="table" tableValues="0.05 0.05"/>
    </feComponentTransfer>
  </filter>
  <rect width="192" height="192" filter="url(#paper)"/>
</svg>
